name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      archive_prefix: ${{ steps.release.outputs.archive_prefix }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e '
            const version = process.argv[1].split(".").map(Number);
            const supported = version[0] > 11 || (version[0] === 11 && (version[1] > 5 || (version[1] === 5 && version[2] >= 1)));
            if (!supported) throw new Error(`npm ${process.argv[1]} is too old; trusted publishing needs npm >= 11.5.1`);
          ' "$npm_version"
      - name: Verify release identity
        id: release
        run: node npm/scripts/release-metadata.mjs --tag "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE" --github-output "$GITHUB_OUTPUT"
      - name: Install npm dependencies
        run: npm ci --ignore-scripts
      # The notice check reads license files straight from the module cache,
      # including modules that only build on other platforms.
      - name: Download Go modules
        run: go mod download all
      - name: Run release verification
        run: npm run verify
      - name: Resolve build metadata
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          commit_timestamp="$(git show -s --format=%ct "$commit")"
          build_date="$(node -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString().replace(".000Z", "Z"))' "$commit_timestamp")"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"
      - name: Build native release archives
        run: |
          set -euo pipefail
          go run ./tools/release \
            --version "${{ steps.release.outputs.release_version }}" \
            --commit "${{ steps.snapshot.outputs.commit }}" \
            --build-date "${{ steps.snapshot.outputs.build_date }}" \
            --output dist
      - name: Stage native npm binaries
        run: npm run stage -- --dist dist
      - name: Assert staged checkout npm pack
        run: PI_WORKER_ASSERT_STAGED=1 node --test --test-name-pattern='current checkout npm pack' npm/test/package.test.mjs
      - name: Build npm package tarball
        run: |
          set -euo pipefail
          npm pack --json | tee dist/npm-pack.json
          npm_tarball="$(node -p "JSON.parse(require('fs').readFileSync('dist/npm-pack.json', 'utf8'))[0].filename")"
          if [ "$npm_tarball" != "${{ steps.release.outputs.npm_tarball }}" ] || [ ! -f "$npm_tarball" ]; then
            echo "npm pack returned an unexpected tarball" >&2
            exit 1
          fi
          mv -- "$npm_tarball" "dist/$npm_tarball"
      - name: Assert release artifact set
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ steps.release.outputs.archive_prefix }}"
          for target in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            test -f "dist/${prefix}${target}.tar.gz"
          done
          test -f dist/checksums.txt
          test -f "dist/${{ steps.release.outputs.npm_tarball }}"
          test -f dist/npm-pack.json
          archive_count="$(find dist -maxdepth 1 -type f -name "${prefix}*.tar.gz" | wc -l | tr -d ' ')"
          test "$archive_count" -eq 4
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-worker-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: |
            dist/${{ steps.release.outputs.archive_prefix }}*.tar.gz
            dist/checksums.txt
            dist/${{ steps.release.outputs.npm_tarball }}
            dist/npm-pack.json
      - name: Publish npm package with trusted publishing
        run: npm publish "./dist/${{ steps.release.outputs.npm_tarball }}" --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pi-worker-${{ needs.publish.outputs.tag }}
          path: dist
      - name: Create GitHub Release with native archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          ARCHIVE_PREFIX: ${{ needs.publish.outputs.archive_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          archives=(dist/"${ARCHIVE_PREFIX}"*.tar.gz)
          if [ "${#archives[@]}" -ne 4 ] || [ ! -f dist/checksums.txt ]; then
            echo "release assets are incomplete" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "${archives[@]}" \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Pi Worker ${TAG}"
