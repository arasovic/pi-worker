name: Release Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Install npm dependencies
        run: npm ci --ignore-scripts
      - name: Run local verification
        run: npm run verify
      - name: Resolve snapshot metadata
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          commit_timestamp="$(git show -s --format=%ct "$commit")"
          build_date="$(node -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString().replace(".000Z", "Z"))' "$commit_timestamp")"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "build-date=${build_date}" >> "$GITHUB_OUTPUT"
      - name: Build release snapshot
        env:
          RELEASE_DIR: dist
          RELEASE_VERSION: v0.1.0
        run: |
          set -euo pipefail
          go run ./tools/release \
            --version "$RELEASE_VERSION" \
            --commit "${{ steps.snapshot.outputs.commit }}" \
            --build-date "${{ steps.snapshot.outputs.build-date }}" \
            --output "$RELEASE_DIR"
      - name: Stage native npm binaries
        run: npm run stage -- --dist dist
      - name: Assert staged checkout npm pack
        run: PI_WORKER_ASSERT_STAGED=1 node --test --test-name-pattern='current checkout npm pack' npm/test/package.test.mjs
      - name: Build npm package snapshot
        id: npm_pack
        run: |
          set -euo pipefail
          npm_pack_inventory="dist/npm-pack.json"
          npm pack --json | tee "$npm_pack_inventory"
          npm_pack_file="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))[0].filename" "$npm_pack_inventory")"
          expected_npm_tarball="$(node -e "const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); process.stdout.write('pi-worker-' + pkg.version + '.tgz');")"
          if [ -z "$npm_pack_file" ]; then
            echo "npm pack did not return a tarball filename" >&2
            exit 1
          fi
          if [ "$npm_pack_file" != "$expected_npm_tarball" ]; then
            echo "expected npm tarball ${expected_npm_tarball} but received ${npm_pack_file}" >&2
            exit 1
          fi
          if [ ! -f "$npm_pack_file" ]; then
            echo "expected npm tarball ${npm_pack_file} is missing" >&2
            exit 1
          fi
          mv -- "$npm_pack_file" "dist/$npm_pack_file"
          echo "npm_tarball=$npm_pack_file" >> "$GITHUB_OUTPUT"
      - name: Assert snapshot artifact set
        run: |
          set -euo pipefail
          test -f "dist/pi-worker_v0.1.0_darwin_arm64.tar.gz"
          test -f "dist/pi-worker_v0.1.0_darwin_amd64.tar.gz"
          test -f "dist/pi-worker_v0.1.0_linux_arm64.tar.gz"
          test -f "dist/pi-worker_v0.1.0_linux_amd64.tar.gz"
          test -f dist/checksums.txt
          test -f "dist/${{ steps.npm_pack.outputs.npm_tarball }}"
          test -f dist/npm-pack.json
          archive_count="$(ls dist/pi-worker_v0.1.0_*.tar.gz | wc -l | tr -d ' ')"
          if [ "$archive_count" -ne 4 ]; then
            echo "expected exactly four release archives" >&2
            exit 1
          fi
      - name: Upload release snapshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pi-worker-release-snapshot
          if-no-files-found: error
          path: |
            dist/pi-worker_v0.1.0_darwin_arm64.tar.gz
            dist/pi-worker_v0.1.0_darwin_amd64.tar.gz
            dist/pi-worker_v0.1.0_linux_arm64.tar.gz
            dist/pi-worker_v0.1.0_linux_amd64.tar.gz
            dist/checksums.txt
            dist/${{ steps.npm_pack.outputs.npm_tarball }}
            dist/npm-pack.json
