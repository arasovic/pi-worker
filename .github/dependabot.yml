version: 2

updates:
  # The only runtime npm dependency is `skills`, pinned exactly because the
  # generated target rules are validated against that version. A bump here also
  # needs npm/generated/skills-rules.json regenerated, which is why its PR is
  # expected to fail check:rules until that is done.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 2
