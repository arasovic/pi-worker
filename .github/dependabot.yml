version: 2

# Every ecosystem here is pinned a second time somewhere the resolver does not
# reach, so each pull request needs one companion commit before it can go green.
# CONTRIBUTING.md lists the exact command per ecosystem. The red run is the
# signal that the coupled artifact is now stale, not noise to silence.
updates:
  # `skills` is the only runtime npm dependency, and the generated target rules
  # record the version they came from.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 2
